services:
  postgres:
    image: postgres:17-alpine
    container_name: minaret-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minaret_academy
      POSTGRES_USER: minaret
      POSTGRES_PASSWORD: minaret_password
    ports:
      - "5432:5432"
    volumes:
      - minaret_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minaret -d minaret_academy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  minaret_pgdata:
